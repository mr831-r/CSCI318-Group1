spring:
  cloud:
    function:
      definition: logItemEvents;logAiEvents;logStockEvents
    stream:
      bindings:
        itemEvents-out-0:
          destination: item-events
        logItemEvents-in-0:
          destination: item-events
          group: log-viewer
        aiEvents-out-0:
          destination: ai-events
        logAiEvents-in-0:
          destination: ai-events
          group: log-viewer
        stockEvents-out-0:
          destination: stock-events
        logStockEvents-in-0:
          destination: stock-events
          group: log-viewer
      kafka:
        binder:
          brokers: ${KAFKA_BROKERS:localhost:9092}
larp:
  database:
    base-url: ${DATABASE_SERVICE_URL:http://localhost:48484}
