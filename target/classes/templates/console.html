<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LARP Service Console</title>
    <style>
        :root {
            --bg: #0b1220;
            --panel: #101a2b;
            --panel-strong: #16253d;
            --accent: #22c55e;
            --accent-2: #60a5fa;
            --accent-3: #f59e0b;
            --text: #e2e8f0;
            --muted: #94a3b8;
            --danger: #f87171;
            --shadow: rgba(15, 23, 42, 0.45);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(180deg, #0f172a, #111827 40%, #020817);
            color: var(--text);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        h1 {
            margin: 0;
            font-size: clamp(2rem, 3vw, 3rem);
        }

        .subtitle {
            color: var(--muted);
            margin-top: 6px;
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .link-btn {
            display: inline-block;
            background: rgba(96, 165, 250, 0.15);
            border: 1px solid rgba(96, 165, 250, 0.4);
            color: #dbeafe;
            padding: 10px 14px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 700;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .panel {
            background: rgba(16, 26, 43, 0.95);
            border: 1px solid rgba(148, 163, 184, 0.18);
            border-radius: 14px;
            padding: 18px;
            box-shadow: 0 10px 28px var(--shadow);
        }

        .panel h2 {
            margin-top: 0;
            margin-bottom: 14px;
            font-size: 1.2rem;
        }

        label {
            display: block;
            margin-top: 10px;
            font-size: 0.9rem;
            color: var(--muted);
        }

        input, button, textarea {
            width: 100%;
            margin-top: 6px;
            border-radius: 10px;
            border: 1px solid rgba(148, 163, 184, 0.28);
            padding: 10px 12px;
            font-size: 0.95rem;
            background: #0f172a;
            color: var(--text);
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        button {
            cursor: pointer;
            font-weight: 700;
            transition: transform 0.15s ease, opacity 0.15s ease;
        }

        button:hover {
            transform: translateY(-1px);
            opacity: 0.96;
        }

        .primary {
            background: var(--accent);
            border: none;
            color: #052e16;
        }

        .secondary {
            background: var(--accent-2);
            border: none;
            color: #dbeafe;
        }

        .warn {
            background: var(--accent-3);
            border: none;
            color: #1f2937;
        }

        .inline-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        .result {
            margin-top: 14px;
            min-height: 140px;
            max-height: 260px;
            overflow: auto;
            white-space: pre-wrap;
            background: rgba(2, 8, 23, 0.9);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 10px;
            padding: 12px;
            font-family: Consolas, monospace;
            color: #d1fae5;
            font-size: 0.82rem;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="topbar">
        <div>
            <h1>LARP Service Console</h1>
            <div class="subtitle">Test the database, editor, AI, shipping, and log features from one page.</div>
        </div>
        <div class="actions">
            <a class="link-btn" href="/health">Health</a>
            <a class="link-btn" href="/h2-console">H2 Console</a>
        </div>
    </div>

    <div class="grid">
        <section class="panel">
            <h2>AI Assistant</h2>
            <label>
                Start date
                <input id="aiStartDate" type="date" value="2026-09-01" />
            </label>
            <label>
                End date
                <input id="aiEndDate" type="date" value="2026-09-10" />
            </label>
            <label>
                AI query
                <input id="aiQuery" type="text" value="iron sword" placeholder="Search inventory or status" />
            </label>
            <label>
                API key
                <input id="aiApiKey" type="password" placeholder="Optional: your provider key" />
            </label>
            <label>
                Model
                <input id="aiModel" type="text" value="gemini-2.0-flash" placeholder="Optional model name" />
            </label>
            <label>
                Provider URL
                <input id="aiProviderUrl" type="url" value="https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent" placeholder="Optional Gemini-compatible endpoint" />
            </label>
            <div class="inline-actions">
                <button class="primary" onclick="callAi()">Ask AI</button>
                <button class="secondary" onclick="getAllItemsForAi()">List inventory</button>
            </div>
            <div class="result" id="aiResult">No AI request yet.</div>
        </section>

        <section class="panel">
            <h2>Editor</h2>
            <label>
                Item code
                <input id="editorItemCode" type="text" value="ITEM-3001" />
            </label>
            <label>
                Name
                <input id="editorName" type="text" value="Steel spear" />
            </label>
            <label>
                Description
                <input id="editorDescription" type="text" value="Steel spear details" />
            </label>
            <label>
                Quantity
                <input id="editorQuantity" type="number" value="7" />
            </label>
            <label>
                Status
                <input id="editorStatus" type="text" value="available" placeholder="available or shipping" />
            </label>
            <label>
                Date
                <input id="editorDate" type="date" value="2026-09-09" />
            </label>
            <div class="inline-actions">
                <button class="primary" onclick="saveEditorItem()">Save item</button>
                <button class="secondary" onclick="getEditorItems()">List items</button>
            </div>
            <div class="inline-actions">
                <button class="warn" onclick="prepopulateEditor()">Load demo data</button>
            </div>
            <div class="result" id="editorResult">No editor action yet.</div>
        </section>

        <section class="panel">
            <h2>Shipping Arrival</h2>
            <label>
                Item code
                <input id="shippingItemCode" type="text" value="ITEM-2002" />
            </label>
            <label>
                Shipping firm / origin
                <input id="shippingDestination" type="text" value="North Camp" />
            </label>
            <label>
                Quantity received
                <input id="shippingQuantity" type="number" value="3" />
            </label>
            <label>
                Arrival status
                <input id="shippingStatus" type="text" value="ARRIVED" />
            </label>
            <label>
                Arrival date
                <input id="shippingDate" type="date" value="2026-09-09" />
            </label>
            <div class="inline-actions">
                <button class="primary" onclick="confirmArrival()">Confirm arrival</button>
                <button class="secondary" onclick="listShippingRequests()">List arrivals</button>
            </div>
            <div class="result" id="shippingResult">No arrival confirmation yet.</div>
        </section>

        <section class="panel">
            <h2>Logs</h2>
            <label>
                Start date
                <input id="logStart" type="date" />
            </label>
            <label>
                End date
                <input id="logEnd" type="date" />
            </label>
            <label>
                Log message
                <textarea id="logMessage">System check from web console</textarea>
            </label>
            <div class="inline-actions">
                <button class="primary" onclick="loadLogs()">Load logs</button>
                <button class="secondary" onclick="addGenericLog()">Add log event</button>
            </div>
            <div class="result" id="logResult">No log query yet.</div>
        </section>
    </div>
</div>

<script>
    const baseUrl = window.location.origin;

    async function callAi() {
        const payload = {
            query: document.getElementById('aiQuery').value,
            startDate: document.getElementById('aiStartDate').value || null,
            endDate: document.getElementById('aiEndDate').value || null,
            apiKey: document.getElementById('aiApiKey').value || null,
            model: document.getElementById('aiModel').value || null,
            providerUrl: document.getElementById('aiProviderUrl').value || null
        };
        const res = await fetch(`${baseUrl}/ai`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        const data = await res.json();
        document.getElementById('aiResult').textContent = JSON.stringify(data, null, 2);
    }

    async function getAllItemsForAi() {
        const res = await fetch(`${baseUrl}/ai`);
        const data = await res.json();
        document.getElementById('aiResult').textContent = JSON.stringify(data, null, 2);
    }

    async function saveEditorItem() {
        const payload = {
            itemCode: document.getElementById('editorItemCode').value,
            name: document.getElementById('editorName').value,
            description: document.getElementById('editorDescription').value,
            quantity: Number(document.getElementById('editorQuantity').value),
            status: document.getElementById('editorStatus').value,
            date: document.getElementById('editorDate').value,
            payslipReference: 'manual-entry'
        };

        const res = await fetch(`${baseUrl}/editor`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        const data = await res.json();
        document.getElementById('editorResult').textContent = JSON.stringify(data, null, 2);
    }

    async function getEditorItems() {
        const res = await fetch(`${baseUrl}/editor`);
        const data = await res.json();
        document.getElementById('editorResult').textContent = JSON.stringify(data, null, 2);
    }

    async function seedEditorItems() {
        const res = await fetch(`${baseUrl}/editor/seed`, { method: 'PUT' });
        const data = await res.json();
        document.getElementById('editorResult').textContent = JSON.stringify(data, null, 2);
    }

    async function prepopulateEditor() {
        const res = await fetch(`${baseUrl}/editor/prepopulate`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify([])
        });
        const data = await res.json();
        document.getElementById('editorResult').textContent = JSON.stringify(data, null, 2);
    }

    async function confirmArrival() {
        const payload = {
            itemCode: document.getElementById('shippingItemCode').value,
            destination: document.getElementById('shippingDestination').value,
            quantity: Number(document.getElementById('shippingQuantity').value),
            status: document.getElementById('shippingStatus').value || 'ARRIVED',
            requestedDate: document.getElementById('shippingDate').value
        };

        const res = await fetch(`${baseUrl}/shipping`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        const data = await res.json();
        document.getElementById('shippingResult').textContent = JSON.stringify(data, null, 2);
    }

    async function listShippingRequests() {
        const res = await fetch(`${baseUrl}/shipping`);
        const data = await res.json();
        document.getElementById('shippingResult').textContent = JSON.stringify(data, null, 2);
    }

    async function addGenericLog() {
        const message = document.getElementById('logMessage').value || 'System event';
        const res = await fetch(`${baseUrl}/log`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message, level: 'INFO' })
        });
        const data = await res.json();
        document.getElementById('logResult').textContent = JSON.stringify(data, null, 2);
    }

    async function loadLogs() {
        const start = document.getElementById('logStart').value;
        const end = document.getElementById('logEnd').value;
        const url = start && end ? `${baseUrl}/log?start=${start}&end=${end}` : `${baseUrl}/log`;
        const res = await fetch(url);
        const data = await res.json();
        document.getElementById('logResult').textContent = JSON.stringify(data, null, 2);
    }

    // Start Server-Sent Events connection to receive real-time log updates
    try {
        const es = new EventSource(`${baseUrl}/log/stream`);
        es.addEventListener('log', (e) => {
            try {
                const entry = JSON.parse(e.data);
                const el = document.getElementById('logResult');
                const now = new Date(entry.timestamp).toLocaleString();
                const line = `[${now}] ${entry.level}: ${entry.message}`;
                // prepend
                el.textContent = line + "\n" + el.textContent;
            } catch (err) {
                console.warn('Failed to parse SSE log event', err);
            }
        });
        es.onerror = (err) => {
            console.warn('SSE connection error', err);
            // the browser will attempt to reconnect automatically
        };
    } catch (err) {
        console.warn('SSE not supported by this browser', err);
    }

    loadLogs();
</script>
</body>
</html>
