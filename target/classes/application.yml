spring:
  cloud:
    function:
      definition: logItemEvents;logAiEvents;logStockEvents;stockLevels
    stream:
      bindings:
        itemEvents-out-0:
          destination: item-events
        logItemEvents-in-0:
          destination: item-events
          group: log-viewer
        aiEvents-out-0:
          destination: ai-events
        logAiEvents-in-0:
          destination: ai-events
          group: log-viewer
        stockEvents-out-0:
          destination: stock-events
        logStockEvents-in-0:
          destination: stock-events
          group: log-viewer
        stockLevels-in-0:
          destination: stock-events
      kafka:
        binder:
          brokers: ${KAFKA_BROKERS:localhost:9092}
        streams:
          binder:
            applicationId: larp-stock-levels
            configuration:
              default.key.serde: org.apache.kafka.common.serialization.Serdes$StringSerde
              default.value.serde: org.apache.kafka.common.serialization.Serdes$IntegerSerde
              spring.json.value.default.type: com.larp.shipping.StockEvent
          bindings:
            stockLevels-in-0:
              consumer:
                keySerde: org.apache.kafka.common.serialization.Serdes$StringSerde
                valueSerde: org.springframework.kafka.support.serializer.JsonSerde
larp:
  database:
    base-url: ${DATABASE_SERVICE_URL:http://localhost:48484}
